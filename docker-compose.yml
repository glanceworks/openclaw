services:
  openclaw-gateway:
    user: "1001:1001"
    image: ${OPENCLAW_IMAGE:-openclaw-local:playwright-runtime}
    build:
      context: .
      dockerfile: Dockerfile.playwright-runtime
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_BASE_IMAGE:?set a reviewed tag-and-digest base reference}
        OPENCLAW_VIKTOR_BUILD_IMAGE: ${OPENCLAW_VIKTOR_BUILD_IMAGE:?set the reviewed current-checkout build image}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /home/node
      NODE_ENV: production
      TERM: xterm-256color
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      XDG_CONFIG_HOME: ${XDG_CONFIG_HOME}
      PATH: /home/linuxbrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT}:${OPENCLAW_GATEWAY_PORT}"
      - "127.0.0.1:8787:8787"
